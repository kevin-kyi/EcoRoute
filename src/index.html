<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Project 2: EV Route Optimizer (Final)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #app { display: flex; height: 100%; }
    #sidebar { width: 340px; padding: 15px; border-right: 1px solid #ccc; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    #map { flex: 1; }
    input, button { width: 100%; padding: 8px; margin-bottom: 5px; box-sizing: border-box; }
    label { font-weight: bold; font-size: 0.9rem; margin-top: 5px; display: block; }
    .section-title { font-size: 1.1rem; border-bottom: 2px solid #ddd; margin-bottom: 10px; padding-bottom: 5px; color: #333; }
    #status-msg { color: #d9534f; font-weight: bold; font-size: 0.9em; min-height: 1.2em;}
  </style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <h2>EV Route Optimizer</h2>
    <div id="status-msg"></div>

    <div class="section-title">📍 Trip Details</div>
    
    <label>Start Address</label>
    <input id="start-input" type="text" placeholder="e.g. 5000 Forbes Ave, Pittsburgh" value="Carnegie Mellon University, Pittsburgh">
    
    <label>Destination Address</label>
    <input id="end-input" type="text" placeholder="e.g. PNC Park, Pittsburgh" value="Point State Park, Pittsburgh">

    <div class="section-title">🚗 Vehicle Specs</div>
    
    <label>Battery Capacity (kWh)</label>
    <input id="capacity-input" type="number" value="60" min="10">
    
    <label>Current Charge (%)</label>
    <input id="current-charge-input" type="number" value="80" min="1" max="100">

    <label>Efficiency (kWh per km)</label>
    <input id="efficiency-input" type="number" value="0.18" step="0.01">
    <small style="color:gray;">(0.15 = Efficient, 0.25 = Truck)</small>

    <br><br>
    <button id="plan-btn" style="background-color: #28a745; color: white; font-weight: bold;">Find Optimized Route</button>

    <div id="summary"></div>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ========= CONFIG =========
  const ORS_API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImNhMzQ5ZjcwOTk2MjRlYjhhODRhMDg5NmJlNDg5Nzc2IiwiaCI6Im11cm11cjY0In0="; 
  const OCM_API_KEY = "6050848c-e5f2-4368-bdf6-af9b90b26dbe"; 

  const map = L.map("map").setView([40.44, -79.99], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap" }).addTo(map);
  
  let mapLayers = [];

  // ========= 1. GEOCODING (Address -> Lat/Lon) =========
  async function geocodeAddress(address) {
    // Use ORS Geocode API to find coordinates
    const url = `https://api.openrouteservice.org/geocode/search?api_key=${ORS_API_KEY}&text=${encodeURIComponent(address)}&boundary.country=US`;
    
    const res = await fetch(url);
    if (!res.ok) throw new Error("Geocoding failed");
    
    const data = await res.json();
    if (data.features && data.features.length > 0) {
      // ORS returns [lon, lat]
      const coords = data.features[0].geometry.coordinates; 
      const label = data.features[0].properties.label;
      return { lon: coords[0], lat: coords[1], name: label };
    }
    throw new Error(`Address not found: ${address}`);
  }

  // ========= 2. ROUTING (Lat/Lon -> Path) =========
  async function getRoute(start, end) {
    const body = { coordinates: [[start.lon, start.lat], [end.lon, end.lat]] };
    
    const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car/geojson", {
      method: "POST",
      headers: { "Authorization": ORS_API_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    if (!res.ok) throw new Error("Routing failed");
    const json = await res.json();
    return json.features[0]; // GeoJSON Feature
  }

  // ========= 3. CHARGER FINDER (Midpoint Logic) =========
  async function findCharger(lon, lat) {
    // OpenChargeMap API
    const url = `https://api.openchargemap.io/v3/poi/?output=json&latitude=${lat}&longitude=${lon}&distance=5&maxresults=1&key=${OCM_API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.length > 0) {
      return { 
        lat: data[0].AddressInfo.Latitude, 
        lon: data[0].AddressInfo.Longitude, 
        title: data[0].AddressInfo.Title 
      };
    }
    return null;
  }

  // ========= MAIN LOGIC =========
  async function planRoute() {
    // Clear previous map layers
    mapLayers.forEach(l => map.removeLayer(l));
    mapLayers = [];
    document.getElementById("status-msg").innerText = "Planning...";
    document.getElementById("summary").innerHTML = "";

    try {
      // A. GET INPUTS
      const startAddr = document.getElementById("start-input").value;
      const endAddr = document.getElementById("end-input").value;
      const batteryCap = parseFloat(document.getElementById("capacity-input").value); // kWh
      const currentPct = parseFloat(document.getElementById("current-charge-input").value); // %
      const kwhPerKm = parseFloat(document.getElementById("efficiency-input").value); // kWh/km

      // B. GEOCODE ADDRESSES
      const startLoc = await geocodeAddress(startAddr);
      const endLoc = await geocodeAddress(endAddr);
      
      console.log("Start:", startLoc);
      console.log("End:", endLoc);

      // Add Start/End Markers
      const startMk = L.marker([startLoc.lat, startLoc.lon]).bindPopup(`Start: ${startLoc.name}`).addTo(map);
      const endMk = L.marker([endLoc.lat, endLoc.lon]).bindPopup(`Dest: ${endLoc.name}`).addTo(map);
      mapLayers.push(startMk, endMk);

      // C. GET BASELINE ROUTE
      const routeGeo = await getRoute(startLoc, endLoc);
      const distanceKm = routeGeo.properties.summary.distance / 1000;
      const durationMin = (routeGeo.properties.summary.duration / 60).toFixed(0);

      // D. CALCULATE ENERGY
      const currentKwh = (currentPct / 100) * batteryCap;
      const neededKwh = distanceKm * kwhPerKm;
      
      if (currentKwh > neededKwh) {
        const poly = L.geoJSON(routeGeo, { style: { color: 'blue', weight: 5 } }).addTo(map);
        mapLayers.push(poly);
        map.fitBounds(poly.getBounds());

        const endPct = ((currentKwh - neededKwh) / batteryCap) * 100;
        
        document.getElementById("summary").innerHTML = `
          <h3 style="color:green">✅ Direct Route Possible</h3>
          <p><b>Distance:</b> ${distanceKm.toFixed(1)} km</p>
          <p><b>Time:</b> ${durationMin} mins</p>
          <p><b>Energy Needed:</b> ${neededKwh.toFixed(1)} kWh</p>
          <p><b>Arrival Charge:</b> ${endPct.toFixed(1)}%</p>
        `;
      } else {
        // FAIL: NEED CHARGER
        document.getElementById("summary").innerHTML = `
          <h3 style="color:orange">⚠️ Charging Needed</h3>
          <p>You need <b>${neededKwh.toFixed(1)} kWh</b> but only have <b>${currentKwh.toFixed(1)} kWh</b>.</p>
          <p><i>(In the full version, we would insert a charging stop here!)</i></p>
        `;
        
        // Visual Fail Route
        const poly = L.geoJSON(routeGeo, { style: { color: 'red', weight: 5, dashArray: '5, 5' } }).addTo(map);
        mapLayers.push(poly);
        map.fitBounds(poly.getBounds());
      }
      
      document.getElementById("status-msg").innerText = "";

    } catch (err) {
      console.error(err);
      document.getElementById("status-msg").innerText = "Error: " + err.message;
    }
  }

  document.getElementById("plan-btn").addEventListener("click", planRoute);
</script>
</body>
</html>
